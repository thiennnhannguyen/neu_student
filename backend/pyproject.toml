[project]
name = "neu-student-backend"
version = "0.1.0"
description = "Backend M11, M12 - bai tap lon, du lieu mau"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
filterwarnings = [
    # SQLite không có kiểu thập phân; cột Numeric có tỷ lệ cố định, phép tính làm bằng Decimal.
    'ignore:Dialect sqlite\+pysqlite does \*not\* support Decimal',
]
